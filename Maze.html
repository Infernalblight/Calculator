<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Infinite Maze</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#000}
#joystick{position:fixed;bottom:20px;left:20px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,0.1);touch-action:none}
#stick{position:absolute;left:40px;top:40px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,0.4)}
</style>
</head>
<body>
<div id="joystick"><div id="stick"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene()
scene.fog=new THREE.Fog(0x000000,10,80)
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000)
camera.position.set(0,2,5)
const renderer=new THREE.WebGLRenderer({antialias:true})
renderer.setSize(innerWidth,innerHeight)
document.body.appendChild(renderer.domElement)

const light=new THREE.DirectionalLight(0xffffff,1)
light.position.set(5,10,5)
scene.add(light)
scene.add(new THREE.AmbientLight(0x666666))

const player=new THREE.Group()
const mat=new THREE.MeshStandardMaterial({color:0xffffff})
const head=new THREE.Mesh(new THREE.SphereGeometry(0.3,16,16),mat)
head.position.y=1.8
const body=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,1.2),mat)
body.position.y=1.1
const leg1=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1),mat)
leg1.position.set(-0.15,0.4,0)
const leg2=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1),mat)
leg2.position.set(0.15,0.4,0)
const arm1=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.9),mat)
arm1.position.set(-0.5,1.2,0)
arm1.rotation.z=0.7
const arm2=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.9),mat)
arm2.position.set(0.5,1.2,0)
arm2.rotation.z=-0.7
player.add(head,body,leg1,leg2,arm1,arm2)
scene.add(player)

const floorMat=new THREE.MeshStandardMaterial({color:0x222222})
const wallMat=new THREE.MeshStandardMaterial({color:0x444444})
const chunks={}
const size=10

function genChunk(cx,cz){
const key=cx+","+cz
if(chunks[key])return
const g=new THREE.Group()
const floor=new THREE.Mesh(new THREE.PlaneGeometry(size,size),floorMat)
floor.rotation.x=-Math.PI/2
floor.position.set(cx*size,0,cz*size)
g.add(floor)
for(let i=0;i<4;i++){
if(Math.random()<0.7){
const wall=new THREE.Mesh(new THREE.BoxGeometry(size,3,0.5),wallMat)
if(i===0){wall.position.set(cx*size,1.5,cz*size-size/2)}
if(i===1){wall.position.set(cx*size,1.5,cz*size+size/2)}
if(i===2){wall.position.set(cx*size-size/2,1.5,cz*size);wall.rotation.y=Math.PI/2}
if(i===3){wall.position.set(cx*size+size/2,1.5,cz*size);wall.rotation.y=Math.PI/2}
g.add(wall)
}
}
scene.add(g)
chunks[key]=g
}

let moveX=0,moveZ=0
const joy=document.getElementById("joystick")
const stick=document.getElementById("stick")
let dragging=false
joy.addEventListener("touchstart",e=>{dragging=true})
joy.addEventListener("touchend",e=>{dragging=false;moveX=0;moveZ=0;stick.style.left="40px";stick.style.top="40px"})
joy.addEventListener("touchmove",e=>{
if(!dragging)return
const r=joy.getBoundingClientRect()
const x=e.touches[0].clientX-r.left-70
const y=e.touches[0].clientY-r.top-70
const d=Math.min(40,Math.hypot(x,y))
const a=Math.atan2(y,x)
const sx=Math.cos(a)*d
const sy=Math.sin(a)*d
stick.style.left=40+sx+"px"
stick.style.top=40+sy+"px"
moveX=sx/40
moveZ=sy/40
})

function animate(){
requestAnimationFrame(animate)
player.position.x+=moveX*0.15
player.position.z+=moveZ*0.15
camera.position.x=player.position.x
camera.position.z=player.position.z+5
camera.lookAt(player.position.x,1.2,player.position.z)
const cx=Math.floor(player.position.x/size)
const cz=Math.floor(player.position.z/size)
for(let x=-2;x<=2;x++)for(let z=-2;z<=2;z++)genChunk(cx+x,cz+z)
renderer.render(scene,camera)
}
animate()
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
</script>
</body>
</html>
