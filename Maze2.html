<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Infinite 3D Maze</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#000}
#joystick{position:fixed;bottom:20px;left:20px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,0.12);touch-action:none}
#stick{position:absolute;left:40px;top:40px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,0.5)}
#look{position:fixed;right:0;top:0;width:50%;height:100%;touch-action:none}
</style>
</head>
<body>
<div id="joystick"><div id="stick"></div></div>
<div id="look"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene()
scene.fog=new THREE.Fog(0x000000,10,90)
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000)
camera.position.y=1.6
const renderer=new THREE.WebGLRenderer({antialias:true})
renderer.setSize(innerWidth,innerHeight)
document.body.appendChild(renderer.domElement)

scene.add(new THREE.AmbientLight(0x666666))
const light=new THREE.DirectionalLight(0xffffff,1)
light.position.set(10,20,10)
scene.add(light)

const player=new THREE.Group()
const mat=new THREE.MeshStandardMaterial({color:0xffffff})
const head=new THREE.Mesh(new THREE.SphereGeometry(0.25,16,16),mat)
head.position.y=1.75
const body=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,1.1),mat)
body.position.y=1.1
const leg1=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1),mat)
leg1.position.set(-0.12,0.4,0)
const leg2=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1),mat)
leg2.position.set(0.12,0.4,0)
const arm1=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.8),mat)
arm1.position.set(-0.45,1.25,0)
arm1.rotation.z=0.7
const arm2=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.8),mat)
arm2.position.set(0.45,1.25,0)
arm2.rotation.z=-0.7
player.add(head,body,leg1,leg2,arm1,arm2)
scene.add(player)

const floorMat=new THREE.MeshStandardMaterial({color:0x222222})
const wallMat=new THREE.MeshStandardMaterial({color:0x444444})
const chunks={}
const walls=[]
const size=10

function genChunk(cx,cz){
const key=cx+","+cz
if(chunks[key])return
const g=new THREE.Group()
const floor=new THREE.Mesh(new THREE.PlaneGeometry(size,size),floorMat)
floor.rotation.x=-Math.PI/2
floor.position.set(cx*size,0,cz*size)
g.add(floor)
for(let i=0;i<4;i++){
if(Math.random()<0.7){
const wall=new THREE.Mesh(new THREE.BoxGeometry(size,3,0.6),wallMat)
if(i===0){wall.position.set(cx*size,1.5,cz*size-size/2)}
if(i===1){wall.position.set(cx*size,1.5,cz*size+size/2)}
if(i===2){wall.position.set(cx*size-size/2,1.5,cz*size);wall.rotation.y=Math.PI/2}
if(i===3){wall.position.set(cx*size+size/2,1.5,cz*size);wall.rotation.y=Math.PI/2}
g.add(wall)
walls.push(wall)
}
}
scene.add(g)
chunks[key]=g
}

let moveX=0,moveZ=0
const joy=document.getElementById("joystick")
const stick=document.getElementById("stick")
let dragging=false
joy.addEventListener("touchstart",()=>dragging=true)
joy.addEventListener("touchend",()=>{dragging=false;moveX=0;moveZ=0;stick.style.left="40px";stick.style.top="40px"})
joy.addEventListener("touchmove",e=>{
if(!dragging)return
const r=joy.getBoundingClientRect()
const x=e.touches[0].clientX-r.left-70
const y=e.touches[0].clientY-r.top-70
const d=Math.min(40,Math.hypot(x,y))
const a=Math.atan2(y,x)
const sx=Math.cos(a)*d
const sy=Math.sin(a)*d
stick.style.left=40+sx+"px"
stick.style.top=40+sy+"px"
moveX=sx/40
moveZ=sy/40
})

let yaw=0,pitch=0
const look=document.getElementById("look")
let lx=0,ly=0,looking=false
look.addEventListener("touchstart",e=>{looking=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY})
look.addEventListener("touchend",()=>looking=false)
look.addEventListener("touchmove",e=>{
if(!looking)return
const dx=e.touches[0].clientX-lx
const dy=e.touches[0].clientY-ly
lx=e.touches[0].clientX
ly=e.touches[0].clientY
yaw-=dx*0.003
pitch-=dy*0.003
pitch=Math.max(-1.3,Math.min(1.3,pitch))
})

function collides(pos){
for(const w of walls){
const b=new THREE.Box3().setFromObject(w)
if(b.distanceToPoint(pos)<0.35)return true
}
return false
}

function animate(){
requestAnimationFrame(animate)
const dir=new THREE.Vector3(
Math.sin(yaw)*moveZ+Math.cos(yaw)*moveX,
0,
Math.cos(yaw)*moveZ-Math.sin(yaw)*moveX
)
const next=player.position.clone().add(dir.multiplyScalar(0.15))
if(!collides(next))player.position.copy(next)
camera.position.copy(player.position).add(new THREE.Vector3(0,1.4,0))
camera.rotation.order="YXZ"
camera.rotation.y=yaw
camera.rotation.x=pitch
const cx=Math.floor(player.position.x/size)
const cz=Math.floor(player.position.z/size)
for(let x=-2;x<=2;x++)for(let z=-2;z<=2;z++)genChunk(cx+x,cz+z)
renderer.render(scene,camera)
}
animate()
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
</script>
</body>
</html>
